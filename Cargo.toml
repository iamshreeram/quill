[package]
name = "quill"
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
description = "Lightweight system-wide text transformer: rewrite your clipboard text via an LLM endpoint"
license = "MIT"
repository = "https://github.com/iamshreeram/quill"
homepage = "https://github.com/iamshreeram/quill"
readme = "README.md"
authors = ["iamshreeram"]
keywords = ["clipboard", "llm", "cli", "text", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
ureq = { version = "2", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
toml = "0.8"
harper-core = { version = "2.13.0", default-features = false }

[[bin]]
name = "quill"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
