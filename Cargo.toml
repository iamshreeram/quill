[package]
name = "quill"
version = "0.3.0"
edition = "2021"
description = "Lightweight system-wide text transformer powered by Claude"

[dependencies]
ureq = { version = "2", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-tls = "0.2"
toml = "0.8"

[[bin]]
name = "quill"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
