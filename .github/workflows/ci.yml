# CI: lint, build + test on Ubuntu/macOS/Windows, and shell-script checks.
# Windows is experimental for the product, but its build, smoke test, package and installer
# checks are BLOCKING in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Windows smoke test (GUI-subsystem binary)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $ver) { throw 'could not read the version from Cargo.toml' }
          "QUILL_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./scripts/smoke-windows.ps1 -Bin ./target/debug/quill.exe -Version $ver
      - name: Windows package (same script and shell as the release job)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/package.sh x86_64-pc-windows-msvc "$QUILL_VER" target/debug/quill.exe dist
      - name: Windows package and install.ps1 checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-install.ps1 -Dist ./dist -Version $env:QUILL_VER -Bin ./target/debug/quill.exe

  scripts:
    name: scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck if missing
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install -y shellcheck
            else
              brew install shellcheck
            fi
          fi
          shellcheck --version
      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh
      - name: shellcheck scripts and tests
        run: shellcheck --severity=warning scripts/*.sh tests/*.sh
      - name: Installer tests
        run: bash tests/install_test.sh
      - name: Release script tests
        run: bash tests/release_scripts_test.sh
      - name: Auto-release tests
        run: bash tests/auto_release_test.sh
